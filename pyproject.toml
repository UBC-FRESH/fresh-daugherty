[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-daugherty"
version = "0.1.0a2"
description = "Open, reproducible ws3-based reproduction of Daugherty (1991): dynamic inconsistency in LP-based forest planning models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "UBC FRESH Lab" }]
keywords = ["forestry", "optimization", "dynamic-programming", "dynamic-inconsistency", "forest-planning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "pydantic>=2",
  "pyyaml",
  "rich",
  "typer",
  "ws3",
  "highspy",
  "pulp",
]

[project.urls]
Homepage = "https://github.com/UBC-FRESH/fresh-daugherty"
Documentation = "https://ubc-fresh.github.io/fresh-daugherty/"
Repository = "https://github.com/UBC-FRESH/fresh-daugherty"
Issues = "https://github.com/UBC-FRESH/fresh-daugherty/issues"
Changelog = "https://github.com/UBC-FRESH/fresh-daugherty/blob/main/CHANGE_LOG.md"

[project.optional-dependencies]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.5",
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "twine>=5",
]
quality = ["ruff>=0.5"]
release = [
  "build>=1.2",
  "twine>=5",
]
test = ["pytest>=8"]

[project.scripts]
fresh-daugherty = "fresh_daugherty.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/fresh_daugherty/instance/umpqua_feis.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]
